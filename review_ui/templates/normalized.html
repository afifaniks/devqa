<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normalized QA Review</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22https://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%221.2em%22 font-size=%2220%22>📝</text></svg>">
  <link rel="stylesheet" href="/static/app.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    #nm-layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 52px); overflow: hidden; }
    #nm-sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #nm-filters { padding: 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
    #nm-list { overflow-y: auto; flex: 1; }

    .nm-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    .nm-item:hover { background: var(--surface2); }
    .nm-item.active { background: var(--accent-muted); border-left: 3px solid var(--accent); }
    .nm-item-repo  { font-size: 11px; color: var(--text-muted); font-family: monospace; margin-bottom: 2px; }
    .nm-item-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
    .nm-item-foot  { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }

    .status-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-pending  { background: var(--yellow-bg);  color: var(--yellow); }
    .status-approved { background: var(--green-bg);   color: var(--green); }
    .status-rejected { background: var(--red-bg);     color: var(--red); }

    .kind-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
    .kind-parametric { background: #ede9fe; color: #6d28d9; }
    .kind-grounded   { background: #dbeafe; color: #1d4ed8; }
    html.dark .kind-parametric { background: #3b0764; color: #c4b5fd; }
    html.dark .kind-grounded   { background: #172554; color: #93c5fd; }
    .leak-pill { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--red-bg); color: var(--red); }

    #nm-detail { overflow-y: auto; padding: 20px 24px; }
    .nm-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 15px; }

    .nm-section { margin-bottom: 20px; }
    .nm-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

    .nm-meta-grid { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
    .nm-meta-label { color: var(--text-muted); font-weight: 500; }
    .nm-meta-value { word-break: break-word; }

    .nm-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .nm-tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--accent-muted); color: var(--accent); font-weight: 500; font-family: monospace; }

    /* QA pair card */
    .nm-pair { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; background: var(--surface); }
    .nm-pair-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .nm-pair-qid { font-family: monospace; font-size: 11px; color: var(--text-muted); }
    .nm-field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 3px; }
    .nm-editor { width: 100%; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); resize: vertical; line-height: 1.6; box-sizing: border-box; }
    .nm-editor:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
    .nm-editor.mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .nm-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .nm-pair-leak { font-size: 11px; color: var(--red); margin-top: 6px; }

    .btn-mini { font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; }
    .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
    .btn-mini.danger:hover { border-color: var(--red); color: var(--red); }

    /* thread comments */
    .nm-comment { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
    .nm-comment.is-question { border-color: #3b82f6; }
    .nm-comment.is-answer   { border-color: #10b981; }
    .nm-comment-header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--surface2); font-size: 12px; border-bottom: 1px solid var(--border); }
    .nm-comment.is-question .nm-comment-header { background: #eff6ff; }
    .nm-comment.is-answer   .nm-comment-header { background: #ecfdf5; }
    html.dark .nm-comment.is-question .nm-comment-header { background: #1e3a5f; }
    html.dark .nm-comment.is-answer   .nm-comment-header { background: #064e3b; }
    .nm-comment-author { font-weight: 600; }
    .nm-role-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
    .role-q { background: #bfdbfe; color: #1e40af; }
    .role-a { background: #a7f3d0; color: #065f46; }
    html.dark .role-q { background: #1e3a5f; color: #93c5fd; }
    html.dark .role-a { background: #064e3b; color: #6ee7b7; }
    .nm-comment-ts { color: var(--text-muted); margin-left: auto; font-size: 11px; }
    .nm-comment-body { padding: 10px 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .nm-thread-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 13px; font-weight: 600; padding: 6px 0; }
    .nm-thread-toggle:hover { color: var(--accent); }
    .nm-thread-arrow { transition: transform 0.2s; font-size: 11px; }
    .nm-thread-arrow.open { transform: rotate(90deg); }

    .nm-note-input { width: 100%; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); box-sizing: border-box; }
    .nm-note-input:focus { outline: none; border-color: var(--accent); }

    .nm-decision-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 0; }
    .btn-accept { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); border-radius: 6px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-accept:hover, .btn-accept.active { background: var(--green); color: #fff; }
    .btn-reject { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); border-radius: 6px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-reject:hover, .btn-reject.active { background: var(--red); color: #fff; }
    .btn-pending { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); border-radius: 6px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-pending:hover, .btn-pending.active { background: var(--yellow); color: #fff; }
    .nm-count { font-size: 13px; color: var(--text-muted); margin-left: 8px; }
  </style>
</head>

<body x-data="app()" x-init="init()">

<div id="topbar">
  <h1>Normalized QA Review</h1>
  <span class="pipeline-badge" style="background:#eef6ff;color:#1d4ed8">eval_pairs</span>
  <span class="nm-count" x-text="`${stats.total||0} threads · ${stats.n_pairs||0} pairs · ${stats.counts?.approved||0} approved`"></span>
  <div class="topbar-right">
    <a class="btn" href="/benchmark">Benchmark</a>
    <a class="btn" href="/open-coding">Open Coding</a>
    <button class="btn" @click="reload()" x-text="reloading ? 'Reloading…' : '↺ Reload'"></button>
    <button class="btn" @click="toggleTheme()" x-text="isDark ? '☀ Light' : '🌙 Dark'"></button>
  </div>
</div>

<div id="nm-layout">

  <!-- ── Sidebar ─────────────────────────────────── -->
  <div id="nm-sidebar">
    <div id="nm-filters">
      <input class="input" type="text" x-model="searchQ" @input.debounce.300ms="loadList()"
             placeholder="Search title, question, answer…" />
      <div style="display:flex;gap:6px">
        <select class="select" x-model="filterRepo" @change="loadList()" style="flex:1">
          <option value="">All repos</option>
          <template x-for="r in repos" :key="r"><option :value="r" x-text="r"></option></template>
        </select>
        <select class="select" x-model="filterStatus" @change="loadList()" style="flex:1">
          <option value="">All status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <select class="select" x-model="filterKnowledge" @change="loadList()">
        <option value="">All knowledge types</option>
        <option value="parametric">Parametric</option>
        <option value="grounded">Grounded</option>
      </select>
    </div>

    <div id="nm-list">
      <template x-for="item in items" :key="item.id">
        <div class="nm-item" :class="{ active: selected && selected.id === item.id }"
             @click="selectRecord(item.index)">
          <div class="nm-item-repo" x-text="item.repo"></div>
          <div class="nm-item-title" x-text="item.title"></div>
          <div class="nm-item-foot">
            <span class="status-badge" :class="`status-${item.status}`" x-text="item.status"></span>
            <template x-for="(k,i) in item.kinds" :key="i">
              <span class="kind-badge" :class="`kind-${k}`" x-text="k[0].toUpperCase()" :title="k"></span>
            </template>
            <span x-show="item.n_pairs>1" style="font-size:10px;color:var(--text-muted)" x-text="`×${item.n_pairs}`"></span>
            <span x-show="item.has_leak" class="leak-pill" title="fix leaked into question">leak</span>
            <span x-show="item.has_error" class="leak-pill" title="normalizer error">err</span>
            <span x-show="item.note" style="font-size:10px">📝</span>
          </div>
        </div>
      </template>
      <div x-show="items.length === 0" style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">
        No threads match
      </div>
    </div>
  </div>

  <!-- ── Detail pane ─────────────────────────────── -->
  <div id="nm-detail">
    <div class="nm-empty" x-show="!selected">Select a thread from the list</div>

    <template x-if="selected">
      <div>
        <!-- Header -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px">
          <div>
            <div style="font-size:11px;color:var(--text-muted);font-family:monospace;margin-bottom:4px" x-text="selected.id"></div>
            <h2 style="margin:0;font-size:17px;line-height:1.3" x-text="selected.title"></h2>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <span class="status-badge" :class="`status-${selected.status}`" style="font-size:12px;padding:3px 10px" x-text="selected.status"></span>
            <a class="btn" :href="selected.url" target="_blank" rel="noopener">↗ GitHub</a>
          </div>
        </div>

        <!-- Error banner -->
        <div x-show="selected.error" class="nm-pair-leak" style="margin-bottom:12px"
             x-text="`Normalizer error: ${selected.error}`"></div>

        <!-- Meta -->
        <div class="nm-section">
          <div class="nm-section-title">Metadata</div>
          <div class="nm-meta-grid">
            <span class="nm-meta-label">Repo</span><span class="nm-meta-value" x-text="selected.repo"></span>
            <span class="nm-meta-label">Reporter</span><span class="nm-meta-value" x-text="selected.reporter || '—'"></span>
            <span class="nm-meta-label">Answerer</span>
            <span class="nm-meta-value" x-text="(selected.answer_author || '—') + ' (' + (selected.source?.answerer_role || '?') + ')'"></span>
            <span class="nm-meta-label">Normalizer</span>
            <span class="nm-meta-value" style="font-family:monospace;font-size:11px" x-text="selected.normalizer_model || '—'"></span>
            <span class="nm-meta-label">In-thread refs</span>
            <span class="nm-meta-value">
              <div class="nm-tags">
                <template x-for="ref in (selected.answer_in_thread_refs || [])" :key="ref"><span class="nm-tag" x-text="ref"></span></template>
                <span x-show="!(selected.answer_in_thread_refs||[]).length" style="color:var(--text-muted)">—</span>
              </div>
            </span>
            <span class="nm-meta-label">Hard facts</span>
            <span class="nm-meta-value">
              <div class="nm-tags">
                <template x-for="(vals,k) in (selected.hard_facts || {})" :key="k">
                  <span class="nm-tag" x-show="vals && vals.length" x-text="`${k}: ${vals.join(', ')}`"></span>
                </template>
                <span x-show="!hasHardFacts()" style="color:var(--text-muted)">none</span>
              </div>
            </span>
          </div>
        </div>

        <!-- ── QA pairs editor (the focus) ───────────── -->
        <div class="nm-section">
          <div class="nm-section-title">
            <span x-text="`Normalized QA pairs (${editPairs.length})`"></span>
            <button class="btn-mini" @click="addPair()">+ Add pair</button>
          </div>

          <template x-for="(p, i) in editPairs" :key="i">
            <div class="nm-pair">
              <div class="nm-pair-head">
                <span class="nm-pair-qid" x-text="p.qid || `pair ${i+1}`"></span>
                <select class="select" style="height:26px;font-size:12px;padding:0 6px" x-model="p.knowledge_type">
                  <option value="parametric">parametric</option>
                  <option value="grounded">grounded</option>
                </select>
                <span class="kind-badge" :class="`kind-${p.knowledge_type}`" x-text="p.knowledge_type"></span>
                <span style="margin-left:auto"></span>
                <button class="btn-mini danger" @click="removePair(i)" x-show="editPairs.length>1">✕ remove</button>
              </div>

              <div class="nm-field-label">Question (self-contained, must not reveal the fix)</div>
              <textarea class="nm-editor" rows="6" x-model="p.question"></textarea>

              <div class="nm-field-label">Answer (grounded exactly on the thread)</div>
              <textarea class="nm-editor" rows="4" x-model="p.answer"></textarea>

              <template x-if="p.knowledge_type === 'grounded'">
                <div>
                  <div class="nm-field-label">Grounding sources (one per line)</div>
                  <textarea class="nm-editor mono" rows="3" x-model="p.groundingText"
                            placeholder="PR #932&#10;https://…/advisory&#10;CVE-2022-25883 advisory"></textarea>
                  <div class="nm-hint">The in-thread artifacts the answer relied on. The answer's own comment is not a source.</div>
                </div>
              </template>

              <div class="nm-pair-leak" x-show="p.leak_flags && p.leak_flags.length"
                   x-text="`⚠ fix leaked into question: ${(p.leak_flags||[]).join(', ')}`"></div>
            </div>
          </template>
        </div>

        <!-- ── Source thread ─────────────────────────── -->
        <div class="nm-section">
          <div class="nm-section-title">Source — Question &amp; Answer</div>
          <template x-for="c in qaComments()" :key="c.id">
            <div class="nm-comment" :class="commentClass(c)">
              <div class="nm-comment-header">
                <span style="font-family:monospace;font-size:11px;color:var(--text-muted)" x-text="c.id"></span>
                <span class="nm-comment-author" x-text="c.author"></span>
                <span x-show="isQuestion(c)" class="nm-role-badge role-q">question</span>
                <span x-show="isAnswer(c)"   class="nm-role-badge role-a">answer</span>
                <span class="nm-comment-ts" x-text="fmtDate(c.timestamp)"></span>
              </div>
              <div class="nm-comment-body" x-text="c.body"></div>
            </div>
          </template>
          <div x-show="qaComments().length===0" style="color:var(--text-muted);font-size:13px">
            (source thread not found — run normalize against the filtered benchmark)
          </div>
        </div>

        <div class="nm-section" x-show="(selected.comments||[]).length > 2">
          <div class="nm-thread-toggle" @click="threadOpen = !threadOpen">
            <span class="nm-thread-arrow" :class="{ open: threadOpen }">▶</span>
            <span x-text="`Full thread (${(selected.comments||[]).length} comments)`"></span>
          </div>
          <template x-if="threadOpen">
            <div>
              <template x-for="c in (selected.comments || [])" :key="c.id">
                <div class="nm-comment" :class="commentClass(c)">
                  <div class="nm-comment-header">
                    <span style="font-family:monospace;font-size:11px;color:var(--text-muted)" x-text="c.id"></span>
                    <span class="nm-comment-author" x-text="c.author"></span>
                    <span x-show="isQuestion(c)" class="nm-role-badge role-q">question</span>
                    <span x-show="isAnswer(c)"   class="nm-role-badge role-a">answer</span>
                    <span class="nm-comment-ts" x-text="fmtDate(c.timestamp)"></span>
                  </div>
                  <div class="nm-comment-body" x-text="c.body"></div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- ── Note ──────────────────────────────────── -->
        <div class="nm-section">
          <div class="nm-section-title">Reviewer note (optional)</div>
          <input class="nm-note-input" type="text" x-model="editNote" placeholder="Reviewer note…" />
        </div>

        <!-- ── Decision bar ──────────────────────────── -->
        <div class="nm-section">
          <div class="nm-section-title">Decision (saves edits)</div>
          <div class="nm-decision-bar">
            <button class="btn-accept" :class="{ active: selected.status==='approved' }" @click="save('approved')" :disabled="saving">✓ Approve</button>
            <button class="btn-reject" :class="{ active: selected.status==='rejected' }" @click="save('rejected')" :disabled="saving">✗ Reject</button>
            <button class="btn-pending" :class="{ active: selected.status==='pending' }" @click="save('pending')" :disabled="saving">⋯ Pending</button>
            <span x-show="saving" style="font-size:13px;color:var(--text-muted)">Saving…</span>
            <span x-show="saveMsg && !saving" x-text="saveMsg" style="font-size:13px;color:var(--green)"></span>
          </div>
          <div x-show="selected.reviewed_at" style="font-size:11px;color:var(--text-muted);margin-top:4px"
               x-text="`Last saved: ${fmtDate(selected.reviewed_at)}`"></div>
        </div>

      </div>
    </template>
  </div><!-- /nm-detail -->

</div><!-- /nm-layout -->

<script>
function app() {
  return {
    items: [], total: 0, repos: [], stats: {},
    searchQ: '', filterRepo: '', filterStatus: '', filterKnowledge: '',
    selected: null, threadOpen: false,
    editPairs: [], editNote: '',
    saving: false, saveMsg: '', reloading: false,
    isDark: localStorage.getItem('theme') === 'dark',

    async init() {
      document.documentElement.classList.toggle('dark', this.isDark);
      this.repos = await fetch('/api/normalized/repos').then(r => r.json());
      await this.loadStats();
      await this.loadList();
    },

    async loadList() {
      const params = new URLSearchParams({ page_size: 1000 });
      if (this.filterRepo)      params.set('repo', this.filterRepo);
      if (this.filterStatus)    params.set('status', this.filterStatus);
      if (this.filterKnowledge) params.set('knowledge', this.filterKnowledge);
      if (this.searchQ)         params.set('q', this.searchQ);
      const data = await fetch(`/api/normalized/records?${params}`).then(r => r.json());
      this.items = data.items; this.total = data.total;
    },

    async loadStats() { this.stats = await fetch('/api/normalized/stats').then(r => r.json()); },

    async selectRecord(index) {
      this.threadOpen = false; this.saveMsg = '';
      const data = await fetch(`/api/normalized/records/${index}`).then(r => r.json());
      this.selected = data;
      this.editPairs = (data.qa_pairs || []).map(p => ({
        qid: p.qid, question: p.question || '', answer: p.answer || '',
        knowledge_type: p.knowledge_type || 'grounded',
        groundingText: (p.grounding_sources || []).join('\n'),
        answer_grounded_in: p.answer_grounded_in || null,
        leak_flags: p.leak_flags || [],
      }));
      this.editNote = data.review_note || '';
    },

    addPair() {
      this.editPairs.push({ qid: null, question: '', answer: '', knowledge_type: 'grounded',
                            groundingText: '', answer_grounded_in: null, leak_flags: [] });
    },
    removePair(i) { this.editPairs.splice(i, 1); },

    payloadPairs() {
      return this.editPairs.map(p => ({
        qid: p.qid, question: p.question, answer: p.answer,
        knowledge_type: p.knowledge_type,
        grounding_sources: p.knowledge_type === 'grounded'
          ? p.groundingText.split('\n').map(s => s.trim()).filter(Boolean) : [],
        answer_grounded_in: p.answer_grounded_in,
      }));
    },

    async save(status) {
      if (!this.selected) return;
      const valid = this.editPairs.every(p => p.question.trim() && p.answer.trim());
      if (!valid && status === 'approved') {
        this.saveMsg = 'Every pair needs a question and an answer'; return;
      }
      this.saving = true; this.saveMsg = '';
      try {
        const resp = await fetch(`/api/normalized/records/${this.selected.index}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, qa_pairs: this.payloadPairs(), note: this.editNote }),
        });
        if (!resp.ok) throw new Error(await resp.text());
        const updated = await fetch(`/api/normalized/records/${this.selected.index}`).then(r => r.json());
        this.selected = updated;
        this.editPairs = (updated.qa_pairs || []).map(p => ({
          qid: p.qid, question: p.question || '', answer: p.answer || '',
          knowledge_type: p.knowledge_type || 'grounded',
          groundingText: (p.grounding_sources || []).join('\n'),
          answer_grounded_in: p.answer_grounded_in || null, leak_flags: p.leak_flags || [],
        }));
        const li = this.items.find(i => i.id === this.selected.id);
        if (li) { li.status = status; li.kinds = this.editPairs.map(p => p.knowledge_type);
                  li.n_pairs = this.editPairs.length; li.has_leak = !!(updated.leak_flags||[]).length; }
        await this.loadStats();
        this.saveMsg = '✓ Saved';
        setTimeout(() => { this.saveMsg = ''; }, 2000);
        if (status !== 'pending') this.advanceNext();
      } catch (e) {
        this.saveMsg = `Error: ${e.message}`;
      } finally { this.saving = false; }
    },

    advanceNext() {
      if (!this.selected) return;
      const cur = this.items.findIndex(i => i.id === this.selected.id);
      const next = this.items.slice(cur + 1).find(i => i.status === 'pending');
      if (next) this.selectRecord(next.index);
    },

    async reload() {
      this.reloading = true;
      await fetch('/api/normalized/reload', { method: 'POST' });
      this.repos = await fetch('/api/normalized/repos').then(r => r.json());
      await this.loadList(); await this.loadStats();
      if (this.selected) await this.selectRecord(this.selected.index);
      this.reloading = false;
    },

    toggleTheme() {
      this.isDark = !this.isDark;
      document.documentElement.classList.toggle('dark', this.isDark);
      localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
    },

    hasHardFacts() {
      const hf = this.selected?.hard_facts || {};
      return Object.values(hf).some(v => Array.isArray(v) && v.length);
    },

    fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
             ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    },

    qaComments() {
      if (!this.selected) return [];
      const qid = this.selected.question_comment_id, aid = this.selected.answer_comment_id;
      return (this.selected.comments || []).filter(c => c.id === qid || c.id === aid);
    },
    isQuestion(c) { return c.id === this.selected?.question_comment_id; },
    isAnswer(c)   { return c.id === this.selected?.answer_comment_id; },
    commentClass(c) { return this.isQuestion(c) ? 'is-question' : (this.isAnswer(c) ? 'is-answer' : ''); },
  };
}
</script>
