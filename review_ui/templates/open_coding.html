<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Coding Review</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22https://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%221.2em%22 font-size=%2220%22>🏷</text></svg>">
  <link rel="stylesheet" href="/static/app.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    /* ── layout ─────────────────────────────────────────── */
    #oc-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 52px);
      overflow: hidden;
    }
    #oc-sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #oc-filters {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    #oc-list { overflow-y: auto; flex: 1; }

    .oc-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .oc-item:hover { background: var(--surface2); }
    .oc-item.active { background: var(--accent-muted); border-left: 3px solid var(--accent); }
    .oc-item-repo  { font-size: 11px; color: var(--text-muted); font-family: monospace; margin-bottom: 2px; }
    .oc-item-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
    .oc-item-codes { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .oc-item-foot  { display: flex; align-items: center; gap: 6px; margin-top: 4px; }

    /* ── status badges ───────────────────────────────────── */
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-pending  { background: var(--yellow-bg);  color: var(--yellow); }
    .status-accepted { background: var(--green-bg);   color: var(--green); }
    .status-rejected { background: var(--red-bg);     color: var(--red); }

    /* ── detail pane ─────────────────────────────────────── */
    #oc-detail { overflow-y: auto; padding: 20px 24px; }
    .oc-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-muted); font-size: 15px;
    }

    /* ── sections ────────────────────────────────────────── */
    .oc-section { margin-bottom: 20px; }
    .oc-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 8px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ── meta grid ───────────────────────────────────────── */
    .oc-meta-grid {
      display: grid; grid-template-columns: 120px 1fr;
      gap: 4px 12px; font-size: 13px;
    }
    .oc-meta-label { color: var(--text-muted); font-weight: 500; }
    .oc-meta-value { word-break: break-word; }
    .oc-meta-value a { color: var(--accent); text-decoration: none; }
    .oc-meta-value a:hover { text-decoration: underline; }

    /* ── text blocks ─────────────────────────────────────── */
    .oc-text-block {
      font-size: 13px; line-height: 1.6;
      background: var(--surface2); border-radius: 6px;
      padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
    }

    /* ── tags ────────────────────────────────────────────── */
    .oc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .oc-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 12px;
      background: var(--accent-muted); color: var(--accent); font-weight: 500;
    }

    /* ── code editor ─────────────────────────────────────── */
    .oc-codes-editor {
      width: 100%;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
      min-height: 90px;
      line-height: 1.7;
      box-sizing: border-box;
    }
    .oc-codes-editor:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
    }
    .oc-codes-hint {
      font-size: 11px; color: var(--text-muted); margin-top: 4px;
    }
    .oc-rationale-editor {
      width: 100%;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      resize: vertical;
      min-height: 60px;
      line-height: 1.6;
      box-sizing: border-box;
    }
    .oc-rationale-editor:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-muted);
    }

    /* ── llm original ────────────────────────────────────── */
    .oc-llm-codes {
      font-size: 12px; color: var(--text-dim);
      font-style: italic; margin-top: 6px;
    }

    /* ── decision bar ────────────────────────────────────── */
    .oc-decision-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 12px 0; margin-top: 4px;
    }
    .btn-accept {
      background: var(--green-bg); color: var(--green);
      border: 1px solid var(--green); border-radius: 6px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-accept:hover, .btn-accept.active { background: var(--green); color: #fff; }
    .btn-reject {
      background: var(--red-bg); color: var(--red);
      border: 1px solid var(--red); border-radius: 6px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-reject:hover, .btn-reject.active { background: var(--red); color: #fff; }
    .btn-pending {
      background: var(--yellow-bg); color: var(--yellow);
      border: 1px solid var(--yellow); border-radius: 6px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-pending:hover, .btn-pending.active { background: var(--yellow); color: #fff; }

    /* ── comments ────────────────────────────────────────── */
    .oc-comment {
      border: 1px solid var(--border); border-radius: 6px;
      margin-bottom: 8px; overflow: hidden;
    }
    .oc-comment.is-question { border-color: #3b82f6; }
    .oc-comment.is-answer   { border-color: #10b981; }
    .oc-comment-header {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; background: var(--surface2);
      font-size: 12px; border-bottom: 1px solid var(--border);
    }
    .oc-comment.is-question .oc-comment-header { background: #eff6ff; }
    .oc-comment.is-answer   .oc-comment-header { background: #ecfdf5; }
    html.dark .oc-comment.is-question .oc-comment-header { background: #1e3a5f; }
    html.dark .oc-comment.is-answer   .oc-comment-header { background: #064e3b; }
    .oc-comment-author { font-weight: 600; }
    .oc-comment-role-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
    }
    .role-q { background: #bfdbfe; color: #1e40af; }
    .role-a { background: #a7f3d0; color: #065f46; }
    html.dark .role-q { background: #1e3a5f; color: #93c5fd; }
    html.dark .role-a { background: #064e3b; color: #6ee7b7; }
    .oc-comment-ts { color: var(--text-muted); margin-left: auto; font-size: 11px; }
    .oc-comment-body {
      padding: 10px 12px; font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }

    /* ── thread toggle ───────────────────────────────────── */
    .oc-thread-toggle {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 600; padding: 6px 0;
      color: var(--text);
    }
    .oc-thread-toggle:hover { color: var(--accent); }
    .oc-thread-arrow { transition: transform 0.2s; font-size: 11px; }
    .oc-thread-arrow.open { transform: rotate(90deg); }

    /* ── note ────────────────────────────────────────────── */
    .oc-note-input {
      width: 100%; font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 6px 8px; border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      box-sizing: border-box;
    }
    .oc-note-input:focus { outline: none; border-color: var(--accent); }

    /* ── topbar count ────────────────────────────────────── */
    .oc-count { font-size: 13px; color: var(--text-muted); margin-left: 8px; }
  </style>
</head>

<body x-data="app()" x-init="init()">

<div id="topbar">
  <h1>Open Coding Review</h1>
  <span class="pipeline-badge" style="background:#fbefff;color:#8250df">Open Codes</span>
  <span class="oc-count" x-text="`${stats.total || 0} records · ${stats.counts?.accepted || 0} accepted`"></span>
  <div class="topbar-right">
    <a class="btn" href="/benchmark">Benchmark</a>
    <button class="btn" @click="exportCodes()" x-text="exporting ? 'Exporting…' : '↓ Export'"></button>
    <button class="btn" @click="reload()" x-text="reloading ? 'Reloading…' : '↺ Reload'"></button>
    <button class="btn" @click="toggleTheme()" x-text="isDark ? '☀ Light' : '🌙 Dark'"></button>
  </div>
</div>

<div id="oc-layout">

  <!-- ── Sidebar ─────────────────────────────────── -->
  <div id="oc-sidebar">
    <div id="oc-filters">
      <input class="input" type="text" x-model="searchQ"
             @input.debounce.300ms="loadList()"
             placeholder="Search title, summary, codes…" />
      <div style="display:flex;gap:6px">
        <select class="select" x-model="filterRepo" @change="loadList()" style="flex:1">
          <option value="">All repos</option>
          <template x-for="r in repos" :key="r">
            <option :value="r" x-text="r"></option>
          </template>
        </select>
        <select class="select" x-model="filterStatus" @change="loadList()" style="flex:1">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </div>

    <div id="oc-list">
      <template x-for="item in items" :key="item.id">
        <div class="oc-item" :class="{ active: selected && selected.id === item.id }"
             @click="selectRecord(item.index)">
          <div class="oc-item-repo" x-text="item.repo"></div>
          <div class="oc-item-title" x-text="`#${item.number} ${item.title}`"></div>
          <div class="oc-item-codes" x-text="item.codes.join(' · ') || '—'"></div>
          <div class="oc-item-foot">
            <span class="status-badge" :class="`status-${item.status}`" x-text="item.status"></span>
            <span x-show="item.note" style="font-size:10px;color:var(--text-muted)">📝</span>
          </div>
        </div>
      </template>
      <div x-show="items.length === 0"
           style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">
        No records match
      </div>
    </div>
  </div>

  <!-- ── Detail pane ─────────────────────────────── -->
  <div id="oc-detail">
    <div class="oc-empty" x-show="!selected">Select a record from the list</div>

    <template x-if="selected">
      <div>

        <!-- Header -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px">
          <div>
            <div style="font-size:11px;color:var(--text-muted);font-family:monospace;margin-bottom:4px"
                 x-text="selected.id"></div>
            <h2 style="margin:0;font-size:17px;line-height:1.3" x-text="selected.title"></h2>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <span class="status-badge" :class="`status-${selected.status}`"
                  style="font-size:12px;padding:3px 10px"
                  x-text="selected.status"></span>
            <a class="btn" :href="selected.url" target="_blank" rel="noopener">↗ GitHub</a>
          </div>
        </div>

        <!-- Meta -->
        <div class="oc-section">
          <div class="oc-section-title">Metadata</div>
          <div class="oc-meta-grid">
            <span class="oc-meta-label">Repo</span>
            <span class="oc-meta-value" x-text="selected.repo"></span>
            <span class="oc-meta-label">Reporter</span>
            <span class="oc-meta-value" x-text="selected.reporter || '—'"></span>
            <span class="oc-meta-label">Answerer</span>
            <span class="oc-meta-value"
                  x-text="(selected.answer_author || '—') + ' (' + (selected.answerer_role || '?') + ')'"></span>
            <span class="oc-meta-label">Artifacts</span>
            <span class="oc-meta-value">
              <div class="oc-tags">
                <template x-for="a in (selected.artifacts_needed || [])" :key="a">
                  <span class="oc-tag" x-text="a"></span>
                </template>
                <span x-show="!selected.artifacts_needed || !selected.artifacts_needed.length"
                      style="color:var(--text-muted)">—</span>
              </div>
            </span>
            <span class="oc-meta-label">Model</span>
            <span class="oc-meta-value" style="font-family:monospace;font-size:11px"
                  x-text="selected.model || '—'"></span>
          </div>
        </div>

        <!-- Summary -->
        <div class="oc-section">
          <div class="oc-section-title">QA Summary</div>
          <div class="oc-text-block" x-text="selected.qa_summary || '—'"></div>
        </div>

        <!-- Q & A -->
        <div class="oc-section">
          <div class="oc-section-title">Question &amp; Answer</div>
          <template x-for="c in qaComments()" :key="c.id">
            <div class="oc-comment" :class="commentClass(c)">
              <div class="oc-comment-header">
                <span class="oc-comment-author" x-text="c.author"></span>
                <span x-show="isQuestion(c)" class="oc-comment-role-badge role-q">question</span>
                <span x-show="isAnswer(c)"   class="oc-comment-role-badge role-a">answer</span>
                <span class="oc-comment-ts" x-text="fmtDate(c.timestamp)"></span>
              </div>
              <div class="oc-comment-body" x-text="c.body"></div>
            </div>
          </template>
        </div>

        <!-- Full thread (collapsible) -->
        <div class="oc-section" x-show="selected.comments && selected.comments.length > 2">
          <div class="oc-thread-toggle" @click="threadOpen = !threadOpen">
            <span class="oc-thread-arrow" :class="{ open: threadOpen }">▶</span>
            <span x-text="`Full Thread (${(selected.comments || []).length} comments)`"></span>
          </div>
          <template x-if="threadOpen">
            <div>
              <template x-for="c in (selected.comments || [])" :key="c.id">
                <div class="oc-comment" :class="commentClass(c)">
                  <div class="oc-comment-header">
                    <span style="font-family:monospace;font-size:11px;color:var(--text-muted)"
                          x-text="c.id"></span>
                    <span class="oc-comment-author" x-text="c.author"></span>
                    <span x-show="isQuestion(c)" class="oc-comment-role-badge role-q">question</span>
                    <span x-show="isAnswer(c)"   class="oc-comment-role-badge role-a">answer</span>
                    <span class="oc-comment-ts" x-text="fmtDate(c.timestamp)"></span>
                  </div>
                  <div class="oc-comment-body" x-text="c.body"></div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- ── Open Codes editor ────────────────────────── -->
        <div class="oc-section">
          <div class="oc-section-title">Open Codes</div>

          <textarea class="oc-codes-editor"
                    x-model="editCodes"
                    placeholder="One code per line&#10;e.g. dependency vulnerability disclosure&#10;fix version inquiry"
                    rows="5"></textarea>
          <div class="oc-codes-hint">One code per line. Edit freely — add, remove, or rewrite.</div>

          <template x-if="selected.llm_codes && selected.llm_codes.join('') !== codesFromLLM">
            <div class="oc-llm-codes">
              LLM original: <span x-text="selected.llm_codes.join(' · ')"></span>
            </div>
          </template>
        </div>

        <!-- ── Rationale ────────────────────────────────── -->
        <div class="oc-section">
          <div class="oc-section-title">Rationale</div>
          <textarea class="oc-rationale-editor"
                    x-model="editRationale"
                    placeholder="Why were these codes chosen?"
                    rows="2"></textarea>
        </div>

        <!-- ── Note ────────────────────────────────────── -->
        <div class="oc-section">
          <div class="oc-section-title">Note (optional)</div>
          <input class="oc-note-input" type="text" x-model="editNote"
                 placeholder="Reviewer note…" />
        </div>

        <!-- ── Decision bar ─────────────────────────────── -->
        <div class="oc-section">
          <div class="oc-section-title">Decision</div>
          <div class="oc-decision-bar">
            <button class="btn-accept" :class="{ active: selected.status === 'accepted' }"
                    @click="save('accepted')" :disabled="saving">
              ✓ Accept
            </button>
            <button class="btn-reject" :class="{ active: selected.status === 'rejected' }"
                    @click="save('rejected')" :disabled="saving">
              ✗ Reject
            </button>
            <button class="btn-pending" :class="{ active: selected.status === 'pending' }"
                    @click="save('pending')" :disabled="saving">
              ⋯ Pending
            </button>
            <span x-show="saving" style="font-size:13px;color:var(--text-muted)">Saving…</span>
            <span x-show="saveMsg && !saving" x-text="saveMsg"
                  style="font-size:13px;color:var(--green)"></span>
          </div>
          <div x-show="selected.verified_at" style="font-size:11px;color:var(--text-muted);margin-top:4px"
               x-text="`Last saved: ${fmtDate(selected.verified_at)}`"></div>
        </div>

      </div>
    </template>
  </div><!-- /oc-detail -->

</div><!-- /oc-layout -->

<script>
function app() {
  return {
    items: [],
    total: 0,
    repos: [],
    stats: {},
    searchQ: '',
    filterRepo: '',
    filterStatus: '',

    selected: null,
    threadOpen: false,
    editCodes: '',
    editRationale: '',
    editNote: '',
    codesFromLLM: '',   // tracks if user has diverged from LLM output

    saving: false,
    saveMsg: '',
    reloading: false,
    exporting: false,
    isDark: localStorage.getItem('theme') === 'dark',

    async init() {
      document.documentElement.classList.toggle('dark', this.isDark);
      this.repos = await fetch('/api/oc/repos').then(r => r.json());
      await this.loadStats();
      await this.loadList();
    },

    async loadList() {
      const params = new URLSearchParams({ page_size: 500 });
      if (this.filterRepo)   params.set('repo', this.filterRepo);
      if (this.filterStatus) params.set('status', this.filterStatus);
      if (this.searchQ)      params.set('q', this.searchQ);
      const data = await fetch(`/api/oc/records?${params}`).then(r => r.json());
      this.items = data.items;
      this.total = data.total;
    },

    async loadStats() {
      this.stats = await fetch('/api/oc/stats').then(r => r.json());
    },

    async selectRecord(index) {
      this.threadOpen = false;
      this.saveMsg = '';
      const data = await fetch(`/api/oc/records/${index}`).then(r => r.json());
      this.selected = data;
      this.editCodes    = (data.codes || []).join('\n');
      this.editRationale = data.rationale || '';
      this.editNote     = data.note || '';
      this.codesFromLLM = (data.llm_codes || []).join('');
    },

    parsedCodes() {
      return this.editCodes
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
    },

    async save(status) {
      if (!this.selected) return;
      this.saving = true;
      this.saveMsg = '';
      try {
        const resp = await fetch(`/api/oc/records/${this.selected.index}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status,
            codes: this.parsedCodes(),
            rationale: this.editRationale,
            note: this.editNote,
          }),
        });
        if (!resp.ok) throw new Error(await resp.text());

        // Refresh record
        const updated = await fetch(`/api/oc/records/${this.selected.index}`).then(r => r.json());
        this.selected = updated;
        this.editCodes    = (updated.codes || []).join('\n');
        this.editRationale = updated.rationale || '';
        this.editNote     = updated.note || '';

        // Update list item inline
        const li = this.items.find(i => i.id === this.selected.id);
        if (li) { li.status = status; li.codes = updated.codes; }

        await this.loadStats();
        this.saveMsg = '✓ Saved';
        setTimeout(() => { this.saveMsg = ''; }, 2000);

        // Auto-advance to next pending
        if (status !== 'pending') this.advanceNext();

      } catch (e) {
        this.saveMsg = `Error: ${e.message}`;
      } finally {
        this.saving = false;
      }
    },

    advanceNext() {
      if (!this.selected) return;
      const cur = this.items.findIndex(i => i.id === this.selected.id);
      const next = this.items.slice(cur + 1).find(i => i.status === 'pending');
      if (next) this.selectRecord(next.index);
    },

    async reload() {
      this.reloading = true;
      await fetch('/api/oc/reload', { method: 'POST' });
      await this.loadList();
      await this.loadStats();
      if (this.selected) await this.selectRecord(this.selected.index);
      this.reloading = false;
    },

    async exportCodes() {
      this.exporting = true;
      const data = await fetch('/api/oc/export', { method: 'POST' }).then(r => r.json());
      alert(`Exported ${data.exported} accepted records`);
      this.exporting = false;
    },

    toggleTheme() {
      this.isDark = !this.isDark;
      document.documentElement.classList.toggle('dark', this.isDark);
      localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
    },

    fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
             ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    },

    qaComments() {
      if (!this.selected) return [];
      const qid = this.selected.question_comment_id;
      const aid = this.selected.answer_comment_id;
      return (this.selected.comments || []).filter(c => c.id === qid || c.id === aid);
    },

    isQuestion(c) { return c.id === this.selected?.question_comment_id; },
    isAnswer(c)   { return c.id === this.selected?.answer_comment_id; },
    commentClass(c) {
      if (this.isQuestion(c)) return 'is-question';
      if (this.isAnswer(c))   return 'is-answer';
      return '';
    },
  };
}
</script>
